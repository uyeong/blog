<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="693" viewBox="0 0 1280 693" role="img" aria-labelledby="title desc">
  <title id="title">수직적 확장 구조</title>
  <desc id="desc">하나의 제품 안에서 개발, 디자인, 기획 담당자가 인접 전문성의 판단을 함께 쌓아 올리며 의사결정 품질을 높이는 구조</desc>
  <defs>
    <style>
      @font-face {
        font-family: 'DiagramKR';
        font-style: normal;
        font-weight: 700;
        src: url(data:font/woff2;base64,) format('woff2');
      }

      :root {
        --bg: #ffffff;
        --boundary-fill: #ffffff;
        --boundary-stroke: #c9c9c9;
        --product-text: #9d9d9d;
        --arrow: #787878;
        --judgement-fill: #191b18;
        --judgement-text: #ffffff;
        --dev-fill: #0f5b49;
        --design-fill: #8b2f18;
        --plan-fill: #43388e;
        --base-text: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171a1d;
          --boundary-fill: #1f2428;
          --boundary-stroke: #6f777d;
          --product-text: #d4d8dc;
          --arrow: #c9ced2;
          --judgement-fill: #e6edf2;
          --judgement-text: #171a1d;
          --dev-fill: #35b890;
          --design-fill: #e17350;
          --plan-fill: #9b8cff;
          --base-text: #101316;
        }
      }

      .bg { fill: var(--bg); }
      .boundary {
        fill: var(--boundary-fill);
        stroke: var(--boundary-stroke);
        stroke-width: 2.5;
        stroke-dasharray: 11 10;
      }
      .productLabel {
        fill: var(--product-text);
        font: 700 24px 'DiagramKR', sans-serif;
      }
      .arrow {
        fill: none;
        stroke: var(--arrow);
        stroke-width: 2.8;
        stroke-linecap: round;
      }
      .arrowTip {
        fill: none;
        stroke: var(--arrow);
        stroke-width: 2.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .card {
        filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.12));
      }
      .judgement { fill: var(--judgement-fill); }
      .dev { fill: var(--dev-fill); }
      .design { fill: var(--design-fill); }
      .plan { fill: var(--plan-fill); }
      .judgementText {
        fill: var(--judgement-text);
        font: 700 23px 'DiagramKR', sans-serif;
      }
      .baseText {
        fill: var(--base-text);
        font: 700 28px 'DiagramKR', sans-serif;
      }
    </style>
  </defs>

  <rect class="bg" width="1280" height="693"/>

  <rect class="boundary" x="136" y="92" width="928" height="530" rx="30"/>
  <text class="productLabel" x="600" y="153" text-anchor="middle">제품</text>

  <g transform="translate(190 250)">
    <rect class="card judgement" x="0" y="0" width="250" height="67" rx="10"/>
    <text class="judgementText" x="125" y="43" text-anchor="middle">기획 판단</text>
    <rect class="card judgement" x="0" y="80" width="250" height="67" rx="10"/>
    <text class="judgementText" x="125" y="123" text-anchor="middle">디자인 판단</text>
    <rect class="card dev" x="0" y="161" width="250" height="84" rx="10"/>
    <text class="baseText" x="125" y="213" text-anchor="middle">개발</text>
  </g>

  <g transform="translate(475 250)">
    <rect class="card judgement" x="0" y="0" width="250" height="67" rx="10"/>
    <text class="judgementText" x="125" y="43" text-anchor="middle">기획 판단</text>
    <rect class="card judgement" x="0" y="80" width="250" height="67" rx="10"/>
    <text class="judgementText" x="125" y="123" text-anchor="middle">개발 판단</text>
    <rect class="card design" x="0" y="161" width="250" height="84" rx="10"/>
    <text class="baseText" x="125" y="213" text-anchor="middle">디자인</text>
  </g>

  <g transform="translate(760 250)">
    <rect class="card judgement" x="0" y="0" width="250" height="67" rx="10"/>
    <text class="judgementText" x="125" y="43" text-anchor="middle">디자인 판단</text>
    <rect class="card judgement" x="0" y="80" width="250" height="67" rx="10"/>
    <text class="judgementText" x="125" y="123" text-anchor="middle">개발 판단</text>
    <rect class="card plan" x="0" y="161" width="250" height="84" rx="10"/>
    <text class="baseText" x="125" y="213" text-anchor="middle">기획</text>
  </g>

  <g aria-label="수직 확장 방향">
    <path class="arrow" d="M1148 570 V114"/>
    <path class="arrowTip" d="M1133 132 L1148 114 L1163 132"/>
  </g>
</svg>
