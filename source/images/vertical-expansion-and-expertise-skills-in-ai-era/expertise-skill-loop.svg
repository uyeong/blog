<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">전문성 스킬 벤다이어그램</title>
  <desc id="desc">제품이라는 경계 안에서 기획, 개발, 디자인 판단이 겹치는 지점에 전문성 스킬이 놓이는 구조</desc>
  <defs>
    <style>
      @font-face {
        font-family: 'DiagramKR';
        font-style: normal;
        font-weight: 700 800;
        src: url(data:font/woff2;base64,) format('woff2');
      }

      :root {
        --bg: #ffffff;
        --boundary-fill: #ffffff;
        --boundary-stroke: #c9c9c9;
        --product-text: #9d9d9d;
        --plan-fill: #7e74d8;
        --dev-fill: #42b99b;
        --design-fill: #f0a58c;
        --circle-stroke: #766f96;
        --center-fill: #191b18;
        --center-stroke: #78736c;
        --center-text: #ffffff;
        --label-text: #2f2a45;
        --label-stroke: rgba(255, 255, 255, 0.68);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171a1d;
          --boundary-fill: #1f2428;
          --boundary-stroke: #6f777d;
          --product-text: #d4d8dc;
          --plan-fill: #9b8cff;
          --dev-fill: #35b890;
          --design-fill: #e17350;
          --circle-stroke: #b8c1ca;
          --center-fill: #e6edf2;
          --center-stroke: #f3f5f6;
          --center-text: #171a1d;
          --label-text: #ffffff;
          --label-stroke: rgba(16, 19, 22, 0.42);
        }
      }

      .bg { fill: var(--bg); }
      .boundary {
        fill: var(--boundary-fill);
        stroke: var(--boundary-stroke);
        stroke-width: 2.5;
        stroke-dasharray: 11 10;
      }
      .productLabel {
        fill: var(--product-text);
        font: 700 26px 'DiagramKR', sans-serif;
      }
      .circle {
        opacity: 0.48;
        stroke: var(--circle-stroke);
        stroke-width: 1.8;
      }
      .plan { fill: var(--plan-fill); }
      .dev { fill: var(--dev-fill); }
      .design { fill: var(--design-fill); }
      .label {
        fill: var(--label-text);
        font: 800 29px 'DiagramKR', sans-serif;
        paint-order: stroke;
        stroke: var(--label-stroke);
        stroke-width: 4px;
        stroke-linejoin: round;
      }
      .center {
        fill: var(--center-fill);
        stroke: var(--center-stroke);
        stroke-width: 2.5;
        filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.18));
      }
      .centerLabel {
        fill: var(--center-text);
        font: 800 30px 'DiagramKR', sans-serif;
      }
    </style>
  </defs>

  <rect class="bg" width="1280" height="720"/>

  <rect class="boundary" x="226" y="32" width="828" height="656" rx="38"/>
  <text class="productLabel" x="640" y="82" text-anchor="middle">제품</text>

  <circle class="circle plan" cx="640" cy="304" r="178"/>
  <circle class="circle dev" cx="520" cy="458" r="178"/>
  <circle class="circle design" cx="760" cy="458" r="178"/>

  <text class="label" x="640" y="247" text-anchor="middle">기획</text>
  <text class="label" x="428" y="532" text-anchor="middle">개발</text>
  <text class="label" x="852" y="532" text-anchor="middle">디자인</text>

  <circle class="center" cx="640" cy="408" r="60"/>
  <text class="centerLabel" x="640" y="420" text-anchor="middle">스킬</text>
</svg>
